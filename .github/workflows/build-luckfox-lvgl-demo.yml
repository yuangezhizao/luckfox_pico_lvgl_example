name: 构建 Luckfox Pico LVGL 例程

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 强制重建 CI 镜像（吸收 apt 安全更新，跳过“已存在则复用”）
        type: boolean
        default: false
  schedule:
    # 北京每月 1 日 08:00（UTC 00:00）自动强制重建 CI 镜像以吸收 apt 安全更新；仅重建镜像、跳过例程编译
    - cron: '0 0 1 * *'
  push:
    branches:
      - dev
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - dev

concurrency:
  # group 含 event_name：push / schedule / workflow_dispatch / pull_request 各自独立并发组，
  # 避免月度 schedule 重建与 push(dev) 例程构建跨事件互相取消（同事件内仍取消旧 run 省资源）
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-image:
    name: 🐳 构建 CI 镜像
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write       # actions/attest：Sigstore keyless 签名
      attestations: write   # actions/attest：上传 attestation 到 GH API
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - name: 📤 检出仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🔐 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 构建/复用镜像并输出 digest
        id: build
        shell: bash
        env:
          # schedule（月度）或手动 force_rebuild 时强制重建，吸收 Dockerfile apt 包的安全更新
          FORCE_REBUILD: ${{ github.event_name == 'schedule' || inputs.force_rebuild == true }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # gh attestation verify 需
        run: |
          set -euo pipefail
          # 断言 digest 合法（sha256:<64hex>），否则 fail loud——防 jq 缺键返回字面量 null 静默下传（见 spec D12）
          assert_digest() {  # $1=场景 $2=digest
            [[ "$2" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "❌ ${1}: 非法 digest '${2}'（期望 sha256:<64hex>）——中止（fail loud）"; exit 1; }
          }
          dest_lock_or_die() {
            # 验证 build provenance：signer 与 source 均锁定受保护的 dev 分支——feature 分支签发的 attestation 不被信任，防具写权限者从自有分支 dispatch 签恶意镜像绕过；单次验证、失败即 fail loud（不对瞬时故障重试）
            # 保障边界见 spec D12 / §9：本验证防 registry 层投毒，不含防回滚/新鲜度、不替代 dev 分支治理
            # 用 --format json：CI 非 TTY 下 gh「成功即静默」，唯 --format json 有输出；成功打印 jq 格式化的 verificationResult（完整解析结果：证书身份 + Rekor 时间戳 + statement，无 base64 bundle 噪音）
            if OUT=$(gh attestation verify "oci://${IMAGE_REF}@${DIGEST}" \
              --repo "${{ github.repository }}" \
              --source-ref refs/heads/dev \
              --signer-workflow "${{ github.repository }}/.github/workflows/build-luckfox-lvgl-demo.yml@refs/heads/dev" \
              --bundle-from-oci --format json 2>&1); then
              echo "✅ provenance 验证通过（signer/source=dev），复用（被验证的 digest 即下游所用）；验证详情："
              echo "${OUT}" | jq '.[].verificationResult' 2>/dev/null || echo "${OUT}"
            else
              # 失败：打印 gh 报错 + 宽松复验（仅 --repo 作信任锚、不绑 signer/source）的完整 verificationResult，打印实际 signer/source 供对比
              echo "❌ 复用镜像 build provenance 强验证（signer/source=dev）未通过——疑似复用投毒或验证服务不可用，拒绝使用并中止（fail loud）。gh 报错："
              echo "${OUT}"
              echo "  ↳ 宽松复验（仅 --repo 作信任锚、不绑 signer/source）该 digest attestation 的完整解析结果（对比实际 signer/source）："
              gh attestation verify "oci://${IMAGE_REF}@${DIGEST}" --repo "${{ github.repository }}" --bundle-from-oci --format json 2>/dev/null \
                | jq '.[].verificationResult' 2>/dev/null \
                || echo "  （未取到 attestation：无签名，或 Sigstore/Rekor/GHCR 暂不可达）"
              exit 1
            fi
          }
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REF="ghcr.io/${OWNER}/luckfox-lvgl-demo-ci"
          TAG=$(sha256sum .cursor/Dockerfile | cut -c1-32)
          echo "镜像标签（Dockerfile 内容 hash）= ${TAG}"
          REBUILT=false
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "pull_request：只复用 dev 签名镜像，不构建、不推送"
            if ! INSPECT_OUT=$(docker buildx imagetools inspect "${IMAGE_REF}:${TAG}" 2>&1); then
              echo "❌ 无已存在镜像；可信镜像只在 dev 上构建"
              echo "${INSPECT_OUT}"
              exit 1
            fi
            echo "✅ ${IMAGE_REF}:${TAG} 已存在——先验证 build provenance 再复用（防 GHCR 复用投毒，见 spec D12）"
            DIGEST=$(docker buildx imagetools inspect "${IMAGE_REF}:${TAG}" --format '{{json .Manifest.Digest}}' | xargs) \
              || { echo "❌ 复用: imagetools inspect 取 Manifest.Digest 失败——中止（fail loud）"; exit 1; }
            assert_digest "复用/inspect" "${DIGEST}"
            dest_lock_or_die
          elif [ "${FORCE_REBUILD}" = "true" ]; then
            echo "🔁 强制重建（schedule 月度 / 手动 force_rebuild）：--no-cache 重跑 apt、跳过复用"
            # 一步 build+push，digest 取自构建产物（buildx metadata 的 containerimage.digest），绝不再按 mutable tag 二次 inspect——消除 push→inspect 之间被重指 tag 的 TOCTOU（见 spec D12）
            docker buildx build --no-cache --push -f .cursor/Dockerfile -t "${IMAGE_REF}:${TAG}" --metadata-file /tmp/bx-meta.json .cursor
            REBUILT=true
            DIGEST=$(jq -er '."containerimage.digest" // empty' /tmp/bx-meta.json) \
              || { echo "❌ force_rebuild: buildx metadata 缺 containerimage.digest——中止（fail loud）"; exit 1; }
            assert_digest "force_rebuild" "${DIGEST}"
          elif INSPECT_OUT=$(docker buildx imagetools inspect "${IMAGE_REF}:${TAG}" 2>&1); then
            echo "✅ ${IMAGE_REF}:${TAG} 已存在——先验证 build provenance 再复用（防 GHCR 复用投毒，见 spec D12）"
            DIGEST=$(docker buildx imagetools inspect "${IMAGE_REF}:${TAG}" --format '{{json .Manifest.Digest}}' | xargs) \
              || { echo "❌ 复用: imagetools inspect 取 Manifest.Digest 失败——中止（fail loud）"; exit 1; }
            assert_digest "复用/inspect" "${DIGEST}"
            dest_lock_or_die
          else
            # inspect 非零：tag 不存在，或 registry 网络/鉴权/5xx 等故障——一律回退可信重建（重建当前 checkout 的 Dockerfile、不放行未验证镜像）；打印 inspect 输出、不静默
            echo "⚠️ imagetools inspect 未成功（tag 不存在，或 registry/网络/鉴权故障），回退到可信重建；inspect 输出如下："
            echo "${INSPECT_OUT}"
            echo "🔨 构建并推送 ${IMAGE_REF}:${TAG}"
            # 同上：一步 build+push + metadata digest，消除 push→inspect 的 TOCTOU
            docker buildx build --push -f .cursor/Dockerfile -t "${IMAGE_REF}:${TAG}" --metadata-file /tmp/bx-meta.json .cursor
            REBUILT=true
            DIGEST=$(jq -er '."containerimage.digest" // empty' /tmp/bx-meta.json) \
              || { echo "❌ 首建: buildx metadata 缺 containerimage.digest——中止（fail loud）"; exit 1; }
            assert_digest "首建" "${DIGEST}"
          fi
          echo "镜像 digest = ${DIGEST}"
          {
            echo "image=${IMAGE_REF}@${DIGEST}"
            echo "image_name=${IMAGE_REF}"
            echo "digest=${DIGEST}"
            echo "rebuilt=${REBUILT}"
          } >> "$GITHUB_OUTPUT"

      - name: 🔏 生成 build provenance attestation（仅新建镜像时；复用镜像的 provenance 已在上步验证）
        if: steps.build.outputs.rebuilt == 'true'
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.build.outputs.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-demo:
    name: 🛠️ ${{ matrix.title }}
    needs: build-image
    # schedule（月度）只重建 CI 镜像、跳过例程编译；push(dev)/workflow_dispatch/pull_request 才跑 matrix 两行
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: glibc · Ubuntu
            os: ubuntu-24.04
            libc: glibc
            rootfs: ubuntu
          - title: uClibc · Buildroot
            os: ubuntu-24.04
            libc: uclibc
            rootfs: buildroot
    steps:
      - name: 📤 检出本仓
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🧰 检出 uClibc 工具链（sparse）
        if: matrix.libc == 'uclibc'
        uses: actions/checkout@v7
        with:
          repository: yuangezhizao/luckfox-pico
          ref: dev
          path: luckfox-pico
          persist-credentials: false
          sparse-checkout: tools/linux/toolchain
          sparse-checkout-cone-mode: true

      - name: 🛠️ 交叉编译
        shell: bash
        run: |
          set -euo pipefail
          unset LUCKFOX_SDK_PATH GLIBC_COMPILER || true
          if [ "${{ matrix.libc }}" = "uclibc" ]; then
            echo "luckfox-pico SHA=$(git -C luckfox-pico rev-parse HEAD)"
            export LUCKFOX_SDK_PATH="${GITHUB_WORKSPACE}/luckfox-pico"
            GCC="${LUCKFOX_SDK_PATH}/tools/linux/toolchain/arm-rockchip830-linux-uclibcgnueabihf/bin/arm-rockchip830-linux-uclibcgnueabihf-gcc"
            test -x "${GCC}"
            echo "gcc -print-sysroot=$("${GCC}" -print-sysroot)"
            echo "cc1=$("${GCC}" -print-file-name=cc1)"
            echo "ld=$("${GCC}" -print-prog-name=ld)"
            ls -la "${LUCKFOX_SDK_PATH}/tools/linux/toolchain/arm-rockchip830-linux-uclibcgnueabihf/bin"
            test -z "${GLIBC_COMPILER+x}" || { echo "❌ uClibc 行不得设置 GLIBC_COMPILER"; exit 1; }
          else
            export GLIBC_COMPILER=/usr/bin/arm-linux-gnueabihf-
            test -x "${GLIBC_COMPILER}gcc"
            test -z "${LUCKFOX_SDK_PATH+x}" || { echo "❌ glibc 行不得设置 LUCKFOX_SDK_PATH"; exit 1; }
          fi
          mkdir -p build
          cd build
          cmake ..
          make -j"$(nproc)"
          if [ "${{ matrix.libc }}" = "glibc" ]; then
            make install
          fi

      - name: 📏 产物清单与体积
        shell: bash
        run: |
          ls -lh build/luckfox_lvgl_demo 2>/dev/null || true
          if [ "${{ matrix.libc }}" = "glibc" ]; then
            ls -lhR install/luckfox_lvgl_demo/ || true
            du -sh install/luckfox_lvgl_demo/ build/ 2>/dev/null || true
          else
            du -sh build/ 2>/dev/null || true
          fi

      - name: ✅ 校验产物与 libc ABI
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.libc }}" = "glibc" ]; then
            BIN=install/luckfox_lvgl_demo/luckfox_lvgl_demo
            test -s "${BIN}"
            test -d install/luckfox_lvgl_demo/lib
            ls install/luckfox_lvgl_demo/lib/*.so*
            WANT=glibc
          else
            BIN=build/luckfox_lvgl_demo
            test -s "${BIN}"
            WANT=uclibc
          fi
          readelf -h "${BIN}" | tee /tmp/ehdr.txt
          grep -q ELF32 /tmp/ehdr.txt
          grep -q ARM /tmp/ehdr.txt
          dyn=$(readelf -d "${BIN}")
          echo "${dyn}"
          if [ "${WANT}" = glibc ]; then
            echo "${dyn}" | grep -q 'NEEDED.*libc.so.6'
            if echo "${dyn}" | grep -q 'NEEDED.*libc.so.0'; then
              echo "❌ glibc 产物链了 uClibc"; exit 1
            fi
          else
            echo "${dyn}" | grep -Eq 'NEEDED.*(libc.so.0|ld-uClibc.so.1)'
            if echo "${dyn}" | grep -q 'NEEDED.*libc.so.6'; then
              echo "❌ uClibc 产物链了 glibc"; exit 1
            fi
          fi

      - name: 🔐 生成 SHA256 校验和
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.libc }}" = "glibc" ]; then
            cd install/luckfox_lvgl_demo
            mapfile -t files < <(find . -maxdepth 1 -type f ! -name 'SHA256SUMS' ! -name '.*' -printf '%P\n' | sort)
            sha256sum -- "${files[@]}" > SHA256SUMS
            cat SHA256SUMS
          else
            cd build
            sha256sum luckfox_lvgl_demo > SHA256SUMS
            cat SHA256SUMS
          fi

      - name: 📦 上传 glibc 产物
        if: matrix.libc == 'glibc'
        uses: actions/upload-artifact@v7
        with:
          name: luckfox_lvgl_demo_${{ matrix.libc }}-${{ matrix.rootfs }}_on-${{ matrix.os }}
          if-no-files-found: error
          path: install/luckfox_lvgl_demo/

      - name: 📦 上传 uClibc 产物
        if: matrix.libc == 'uclibc'
        uses: actions/upload-artifact@v7
        with:
          name: luckfox_lvgl_demo_${{ matrix.libc }}-${{ matrix.rootfs }}_on-${{ matrix.os }}
          if-no-files-found: error
          path: |
            build/luckfox_lvgl_demo
            build/SHA256SUMS
